<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hangout</title>
<style>
:root{--bg:#313338;--panel:#2b2d31;--dark:#1e1f22;--hover:#35373c;--text:#f2f3f5;--muted:#949ba4;--accent:#5865f2;--line:#3f4147;--green:#23a559;--red:#da373c}*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}#auth{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(420px,100%);padding:30px;border-radius:12px;background:var(--panel);box-shadow:0 12px 40px #0005}h1{margin:0 0 8px;font-size:25px}.sub{color:var(--muted);margin:0 0 24px}.field{display:grid;gap:7px;margin:15px 0;color:#c9ccd1;font-size:13px;font-weight:700}input{width:100%;border:1px solid var(--dark);border-radius:6px;background:var(--dark);color:var(--text);padding:11px;outline:none}input:focus{border-color:var(--accent)}.primary,.send{border:0;border-radius:6px;background:var(--accent);color:white;padding:10px 15px;font-weight:700}.primary{width:100%}.link-btn{border:0;background:none;color:#00a8fc;padding:12px 0 0}#auth-error{color:#ff777b;min-height:20px;font-size:13px}#app{height:100vh;min-height:500px;display:grid;grid-template-columns:68px 245px minmax(0,1fr) 205px;overflow:hidden}.servers{background:var(--dark);padding:12px 9px;display:flex;flex-direction:column;align-items:center;gap:9px;overflow:auto}.server-icon{width:46px;height:46px;border:0;border-radius:16px;background:var(--accent);color:white;font-weight:800;font-size:17px;flex:none}.server-icon.active{border-radius:14px;outline:2px solid white}.server-add{background:#36383e;font-size:24px}.channels{background:var(--panel);display:flex;flex-direction:column;min-width:0}.server-head{height:52px;padding:0 13px;display:flex;align-items:center;border-bottom:1px solid var(--dark);font-weight:750;gap:8px}.server-head button,.channel-add,.small-btn{border:0;background:transparent;color:var(--muted);padding:5px 7px;border-radius:4px}.server-head button:hover,.channel-add:hover,.small-btn:hover{background:var(--hover);color:white}.server-head .server-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.channel-title{padding:20px 12px 7px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.06em;display:flex;align-items:center}.channel-add{margin-left:auto;font-size:17px}.channel-list{overflow:auto}.channel-row{display:flex;align-items:center;margin:2px 7px;border-radius:5px}.channel{flex:1;min-width:0;padding:8px 9px;border:0;border-radius:5px;background:transparent;color:#b5bac1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.channel:hover,.channel-row.active{background:#404249;color:white}.hash{color:var(--muted);margin-right:7px}.channel-tools{display:none}.channel-row:hover .channel-tools{display:block}.profile{margin-top:auto;padding:11px 9px;background:#232428;display:flex;align-items:center;gap:8px;min-width:0}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;object-fit:cover;background:#5865f2;color:white;font-weight:800;flex:none}.profile-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:700}.profile-status{color:var(--muted);font-size:10px}.profile-actions{margin-left:auto;display:flex;gap:2px}.profile-actions button{border:0;background:transparent;color:var(--muted);padding:5px}.chat{display:flex;flex-direction:column;min-width:0;background:var(--bg)}.chat-head{height:52px;border-bottom:1px solid var(--dark);display:flex;align-items:center;padding:0 19px;gap:8px;font-weight:750}.topic{color:var(--muted);font-size:12px;font-weight:400;margin-left:8px;padding-left:12px;border-left:1px solid var(--line)}#messages{flex:1;overflow-y:auto;padding:18px clamp(12px,3vw,38px)}.welcome{margin:8px 0 22px;padding-bottom:17px;border-bottom:1px solid var(--line)}.welcome h2{font-size:23px;margin:0 0 5px}.welcome p{margin:0;color:var(--muted)}.message{display:flex;gap:12px;margin:17px 0}.message .avatar{width:39px;height:39px}.message-main{min-width:0;flex:1}.message-meta{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.message-author{font-weight:700}.message-time{color:var(--muted);font-size:11px}.message-text{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:3px;color:#dbdee1}.message-actions{display:flex;gap:3px;opacity:.65;margin-top:4px}.message:hover .message-actions{opacity:1}.message-actions button{border:0;border-radius:4px;background:#25262a;color:#c9ccd1;padding:3px 7px;font-size:11px}.message-actions button:hover{background:#454750;color:white}.reply-quote{border-left:3px solid var(--accent);padding:4px 8px;margin:4px 0;color:#b8bbc2;background:#292b30;border-radius:0 4px 4px 0;font-size:12px}.reply-quote strong{color:#e2e4e9}.composer-wrap{padding:0 clamp(12px,3vw,38px) 20px}.composer{display:flex;gap:9px;padding:9px;background:#383a40;border-radius:8px;align-items:center}.composer input{background:transparent;border:0;padding:5px;flex:1;min-width:0}.composer input:focus{border:0}.send:disabled{opacity:.45}.notice{color:var(--muted);font-size:11px;text-align:center;padding:7px}.replying{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#292b30;border-radius:6px 6px 0 0;color:var(--muted);font-size:12px}.replying button{margin-left:auto;border:0;background:none;color:var(--muted)}.members{background:var(--panel);border-left:1px solid var(--dark);padding:14px 10px;overflow:auto}.members h3{font-size:11px;color:var(--muted);letter-spacing:.06em;margin:5px 7px 12px}.member{display:flex;align-items:center;gap:8px;padding:6px;border-radius:5px}.member .avatar{width:30px;height:30px;font-size:12px}.member-name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.presence-dot{width:9px;height:9px;border-radius:50%;background:#747f8d;flex:none}.presence-dot.online{background:var(--green)}.member-state{font-size:10px;color:var(--muted)}.modal-backdrop{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px;z-index:5}.modal{width:min(420px,100%);background:var(--panel);border-radius:10px;padding:20px;box-shadow:0 12px 40px #0008}.modal h2{margin:0 0 14px;font-size:19px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.secondary{border:0;border-radius:6px;background:#454750;color:white;padding:9px 13px}.danger{background:var(--red)}.avatar-preview{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#5865f2;margin:4px 0 10px}.file-input{padding:8px;background:var(--dark)}@media(max-width:850px){#app{grid-template-columns:55px 190px minmax(0,1fr)}.members{display:none}}@media(max-width:560px){#app{grid-template-columns:48px 135px minmax(0,1fr)}.servers{padding:8px 4px}.server-icon{width:38px;height:38px}.server-head{padding:0 8px;font-size:12px}.topic{display:none}#messages{padding:12px 8px}.composer-wrap{padding:0 8px 10px}.message-actions{opacity:1}}
</style>
</head>
<body>
<section id="auth"><div class="auth-card"><h1>Hangout</h1><p class="sub">友達と話すための、小さなWebチャット。</p><form id="auth-form"><label class="field">メールアドレス<input id="email" type="email" autocomplete="username" required></label><label class="field">パスワード<input id="password" type="password" autocomplete="current-password" minlength="6" required></label><label class="field hidden" id="name-field">表示名（新規登録時）<input id="display-name" maxlength="24" placeholder="例：A"></label><button class="primary" id="auth-submit">ログイン</button></form><button class="link-btn" id="toggle-auth" type="button">アカウントを新規作成する</button><p id="auth-error" role="status"></p><p class="notice">このチャットは招待されたメンバー向けです。</p></div></section>
<main id="app" class="hidden"><aside class="servers" id="server-list"></aside><aside class="channels"><div class="server-head"><span class="server-name" id="server-name">Hangout</span><button id="server-settings" title="サーバー設定">⚙</button></div><div class="channel-title">テキストチャンネル<button class="channel-add" id="add-channel" title="チャンネルを作成">＋</button></div><div class="channel-list" id="channel-list"></div><div class="profile"><img class="avatar" id="my-avatar" alt=""><div style="min-width:0;flex:1"><div class="profile-name" id="my-name">User</div><div class="profile-status">アカウント</div></div><div class="profile-actions"><button id="edit-profile" title="プロフィール編集">⚙</button><button id="logout" title="ログアウト">↪</button></div></div></aside>
<section class="chat"><header class="chat-head"><span class="hash">#</span><span id="channel-name">general</span><span class="topic">みんなで気軽に話そう</span></header><div id="messages"><div class="welcome"><h2># <span id="welcome-channel">general</span> へようこそ</h2><p>このチャンネルの最初のメッセージを送ってみよう。</p></div><div id="message-list"></div></div><div class="composer-wrap"><div id="replying" class="replying hidden"><span id="replying-label"></span><button id="cancel-reply">✕</button></div><form class="composer" id="message-form"><input id="message-input" maxlength="2000" placeholder="#general にメッセージを送信" autocomplete="off" required><button class="send" id="send-button">送信</button></form><div class="notice" id="connection-note">メッセージはメンバー間で共有されます。</div></div></section><aside class="members"><h3>メンバー — <span id="member-count">0</span></h3><div id="member-list"></div></aside></main>
<div id="modal-root"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,updateProfile,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,getDocs,addDoc,setDoc,updateDoc,deleteDoc,query,where,orderBy,limit,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import{getDatabase,ref as dbRef,onValue,set,onDisconnect,serverTimestamp as dbTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
// 以前のindex.htmlに設定したFirebase値をここへコピー。databaseURLはRealtime Databaseの画面に表示されるURL。
const firebaseConfig={apiKey:"AIzaSyCpHI7O58nyDjGD0rTfmj5zr_X93paDYTg",authDomain:"chat-c82ce.firebaseapp.com",projectId:"chat-c82ce",appId:"1:988612557493:web:6dd2fa43ef21dccd8a5cfc",databaseURL:"https://chat-c82ce-default-rtdb.asia-southeast1.firebasedatabase.app"};
const $=s=>document.querySelector(s);let app,auth,db,rtdb,currentUser=null,myProfile={},isAdmin=false,activeServerId="",activeChannelId="",stopMessages=null,stopChannels=null,stopServers=null,stopMembers=null,stopProfiles=null,stopPresence=null,stopConnection=null,replyTarget=null,servers=[],channels=[],members=[],profiles={},presence={};let signup=false;
const ready=!Object.values(firebaseConfig).some(v=>v.includes("YOUR_"));if(!ready){$("#auth-error").textContent="index.html のFirebase設定を入力してください。";$("#auth-submit").disabled=true}else{app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);rtdb=getDatabase(app);onAuthStateChanged(auth,handleAuth)}
$("#toggle-auth").onclick=()=>{signup=!signup;$("#name-field").classList.toggle("hidden",!signup);$("#auth-submit").textContent=signup?"アカウントを作成":"ログイン";$("#toggle-auth").textContent=signup?"ログインに戻る":"アカウントを新規作成する";$("#auth-error").textContent=""};
$("#auth-form").onsubmit=async e=>{e.preventDefault();if(!auth)return;$("#auth-submit").disabled=true;try{let email=$("#email").value.trim(),password=$("#password").value;if(signup){let nickname=$("#display-name").value.trim()||email.split("@")[0],cred=await createUserWithEmailAndPassword(auth,email,password);await updateProfile(cred.user,{displayName:nickname});await setDoc(doc(db,"profiles",cred.user.uid),{nickname,avatarData:"",updatedAt:serverTimestamp()})}else await signInWithEmailAndPassword(auth,email,password)}catch(e){$("#auth-error").textContent=errText(e)}finally{$("#auth-submit").disabled=false}};
async function handleAuth(user){currentUser=user;if(!user){cleanup();$("#auth").classList.remove("hidden");$("#app").classList.add("hidden");return}try{let memberSnap=await getDoc(doc(db,"members",user.uid));if(!memberSnap.exists())throw new Error("このアカウントはまだメンバー登録されていません。管理者にメンバー追加を依頼してください。");isAdmin=memberSnap.data().role==="admin";let p=await getDoc(doc(db,"profiles",user.uid));myProfile=p.exists()?p.data():{nickname:user.displayName||user.email.split("@")[0],avatarData:""};if(!p.exists())await setDoc(doc(db,"profiles",user.uid),{...myProfile,updatedAt:serverTimestamp()});renderMyProfile();$("#auth").classList.add("hidden");$("#app").classList.remove("hidden");startPresence();subscribePeople();await bootstrapDefault();subscribeServers()}catch(e){$("#auth").classList.remove("hidden");$("#app").classList.add("hidden");$("#auth-error").textContent=errText(e);await signOut(auth).catch(()=>{})}}
function cleanup(){[stopMessages,stopChannels,stopServers,stopMembers,stopProfiles,stopPresence,stopConnection].forEach(fn=>{if(fn)fn()});stopMessages=stopChannels=stopServers=stopMembers=stopProfiles=stopPresence=stopConnection=null}
async function bootstrapDefault(){let snap=await getDocs(collection(db,"servers"));if(snap.empty&&isAdmin){await setDoc(doc(db,"servers","hangout"),{name:"Hangout",createdAt:serverTimestamp(),ownerUid:currentUser.uid,archived:false});for(let name of ["general","雑談","連絡"])await setDoc(doc(db,"channels",name),{serverId:"hangout",name,createdAt:serverTimestamp(),archived:false})}}
function startPresence(){const connected=dbRef(rtdb,".info/connected"),statusRef=dbRef(rtdb,"status/"+currentUser.uid);stopConnection=onValue(connected,async snap=>{if(snap.val()===true){await onDisconnect(statusRef).set({state:"offline",last_changed:dbTimestamp()});await set(statusRef,{state:"online",last_changed:dbTimestamp()})}});stopPresence=onValue(dbRef(rtdb,"status"),snap=>{presence=snap.val()||{};renderMembers()})}
function subscribePeople(){stopMembers=onSnapshot(collection(db,"members"),s=>{members=s.docs.map(d=>({uid:d.id,...d.data()}));renderMembers()});stopProfiles=onSnapshot(collection(db,"profiles"),s=>{profiles={};s.forEach(d=>profiles[d.id]=d.data());renderMembers();renderMessagesProfileRefresh()})}
function subscribeServers(){if(stopServers)stopServers();stopServers=onSnapshot(query(collection(db,"servers"),where("archived","==",false)),s=>{servers=s.docs.map(d=>({id:d.id,...d.data()}));if(!servers.length&&isAdmin)bootstrapDefault();if(!servers.some(x=>x.id===activeServerId))activeServerId=servers[0]?.id||"";renderServers();if(activeServerId){let active=servers.find(x=>x.id===activeServerId);$("#server-name").textContent=active?.name||"Server";subscribeChannels()}else{$("#channel-list").replaceChildren();$("#server-name").textContent="サーバーなし"}})}
function renderServers(){let root=$("#server-list");root.replaceChildren();servers.forEach(s=>{let b=document.createElement("button");b.className="server-icon"+(s.id===activeServerId?" active":"");b.title=s.name;b.textContent=(s.name||"?").slice(0,1).toUpperCase();b.onclick=()=>{activeServerId=s.id;activeChannelId="";renderServers();$("#server-name").textContent=s.name;subscribeChannels()};root.append(b)});if(isAdmin){let add=document.createElement("button");add.className="server-icon server-add";add.textContent="+";add.title="サーバー作成";add.onclick=createServer;root.append(add)}}
function subscribeChannels(){if(stopChannels)stopChannels();stopChannels=onSnapshot(query(collection(db,"channels"),where("serverId","==",activeServerId)),s=>{channels=s.docs.map(d=>({id:d.id,...d.data()})).filter(c=>!c.archived).sort((a,b)=>(a.name||"").localeCompare(b.name||"","ja"));if(!channels.some(c=>c.id===activeChannelId))activeChannelId=channels[0]?.id||"";renderChannels();if(activeChannelId)selectChannel(activeChannelId);else{if(stopMessages)stopMessages();$("#message-list").replaceChildren();$("#channel-name").textContent="チャンネルなし"}})}
function renderChannels(){let root=$("#channel-list");root.replaceChildren();channels.forEach(c=>{let row=document.createElement("div");row.className="channel-row"+(c.id===activeChannelId?" active":"");let b=document.createElement("button");b.className="channel";b.innerHTML='<span class="hash">#</span>';b.append(document.createTextNode(c.name));b.onclick=()=>selectChannel(c.id);row.append(b);if(isAdmin){let tools=document.createElement("span");tools.className="channel-tools";let edit=document.createElement("button");edit.className="small-btn";edit.textContent="⋯";edit.title="チャンネル設定";edit.onclick=()=>manageChannel(c);tools.append(edit);row.append(tools)}root.append(row)});$("#add-channel").classList.toggle("hidden",!isAdmin)}
function selectChannel(id){activeChannelId=id;let c=channels.find(x=>x.id===id);if(!c)return;$("#channel-name").textContent=c.name;$("#welcome-channel").textContent=c.name;$("#message-input").placeholder="#"+c.name+" にメッセージを送信";renderChannels();subscribeMessages()}
function subscribeMessages(){if(stopMessages)stopMessages();$("#message-list").replaceChildren();let q=query(collection(db,"channels",activeChannelId,"messages"),orderBy("createdAt","asc"),limit(150));stopMessages=onSnapshot(q,s=>{let root=$("#message-list");root.replaceChildren();s.forEach(d=>root.append(renderMessage(d.id,d.data())));$("#messages").scrollTop=$("#messages").scrollHeight},e=>$("#connection-note").textContent="読み込みエラー: "+errText(e))}
function renderMessage(id,data){let item=document.createElement("article");item.className="message";let prof=profiles[data.uid]||{},name=prof.nickname||data.displayName||"Unknown",avatar=makeAvatar(name,prof.avatarData);let main=document.createElement("div");main.className="message-main";let meta=document.createElement("div");meta.className="message-meta";let author=document.createElement("span");author.className="message-author";author.textContent=name;let time=document.createElement("time");time.className="message-time";time.textContent=(data.createdAt?.toDate?data.createdAt.toDate().toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"送信中")+(data.updatedAt?" ・編集済み":"");meta.append(author,time);main.append(meta);if(data.replyTo){let quote=document.createElement("div");quote.className="reply-quote";quote.textContent="返信先: "+data.replyTo.displayName+" — "+data.replyTo.text;main.append(quote)}let body=document.createElement("div");body.className="message-text";body.textContent=data.text||"";main.append(body);let actions=document.createElement("div");actions.className="message-actions";addAction(actions,"返信",()=>setReply({id,uid:data.uid,displayName:name,text:data.text}));addAction(actions,"引用",()=>{let qtext=(data.text||"").split("\n").map(x=>"> "+x).join("\n");$("#message-input").value=$("#message-input").value?( $("#message-input").value+"\n"+qtext):qtext;$("#message-input").focus()});if(data.uid===currentUser.uid||isAdmin){if(data.uid===currentUser.uid)addAction(actions,"編集",()=>editMessage(id,data));addAction(actions,"削除",()=>deleteMessage(id),true)}main.append(actions);item.append(avatar,main);return item}
function addAction(root,label,fn,danger=false){let b=document.createElement("button");b.textContent=label;if(danger)b.style.color="#ff777b";b.onclick=fn;root.append(b)}
function makeAvatar(name,data){let img=document.createElement("img");img.className="avatar";img.alt="";if(data){img.src=data}else{img.src="";img.style.display="none";let fallback=document.createElement("div");fallback.className="avatar";fallback.textContent=(name||"?").slice(0,1).toUpperCase();return fallback}return img}
function renderMyProfile(){let a=$("#my-avatar");a.src=myProfile.avatarData||"";if(!myProfile.avatarData){a.style.display="grid";a.alt=(myProfile.nickname||"?").slice(0,1).toUpperCase();a.src=makeLetterSvg(a.alt)}else a.style.display="block";$("#my-name").textContent=myProfile.nickname||"User"}
function makeLetterSvg(letter){return "data:image/svg+xml,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="100%" height="100%" fill="#5865f2"/><text x="50%" y="56%" dominant-baseline="middle" text-anchor="middle" font-size="42" fill="white">${letter.replace(/[&<>]/g,"")}</text></svg>`)}
function renderMembers(){let root=$("#member-list");if(!root)return;root.replaceChildren();$("#member-count").textContent=members.length;members.forEach(m=>{let p=profiles[m.uid]||{},name=p.nickname||m.uid.slice(0,7),state=presence[m.uid]?.state==="online";let row=document.createElement("div");row.className="member";row.append(makeAvatar(name,p.avatarData));let label=document.createElement("span");label.className="member-name";label.textContent=name;let dot=document.createElement("span");dot.className="presence-dot"+(state?" online":"");dot.title=state?"オンライン":"オフライン";row.append(label,dot);root.append(row)})}
function renderMessagesProfileRefresh(){if(activeChannelId&&currentUser)subscribeMessages()}
$("#message-form").onsubmit=async e=>{e.preventDefault();let text=$("#message-input").value.trim();if(!text||!currentUser||!activeChannelId)return;let b=$("#send-button");b.disabled=true;try{await addDoc(collection(db,"channels",activeChannelId,"messages"),{text,uid:currentUser.uid,displayName:myProfile.nickname||currentUser.displayName||"User",createdAt:serverTimestamp(),replyTo:replyTarget||null});$("#message-input").value="";setReply(null)}catch(e){$("#connection-note").textContent="送信できませんでした: "+errText(e)}finally{b.disabled=false;$("#message-input").focus()}};
function setReply(target){replyTarget=target;$("#replying").classList.toggle("hidden",!target);$("#replying-label").textContent=target?target.displayName+" への返信: "+target.text.slice(0,90):""}$("#cancel-reply").onclick=()=>setReply(null);
async function editMessage(id,data){let next=prompt("メッセージを編集",data.text||"");if(next===null||!next.trim())return;try{await updateDoc(doc(db,"channels",activeChannelId,"messages",id),{text:next.trim(),updatedAt:serverTimestamp()})}catch(e){alert(errText(e))}}
async function deleteMessage(id){if(!confirm("このメッセージを削除しますか？"))return;try{await deleteDoc(doc(db,"channels",activeChannelId,"messages",id))}catch(e){alert(errText(e))}}
$("#edit-profile").onclick=()=>openProfileModal();function openProfileModal(){let root=$("#modal-root");root.replaceChildren();let wrap=document.createElement("div");wrap.className="modal-backdrop";let box=document.createElement("div");box.className="modal";box.innerHTML='<h2>プロフィール編集</h2><label class="field">ニックネーム<input id="profile-nickname" maxlength="24"></label><label class="field">アイコン画像<input id="profile-file" class="file-input" type="file" accept="image/*"></label><img id="profile-preview" class="avatar-preview" alt="プレビュー"><div class="modal-actions"><button class="secondary" id="profile-cancel">キャンセル</button><button class="primary" id="profile-save" style="width:auto">保存</button></div>';wrap.append(box);root.append(wrap);$("#profile-nickname").value=myProfile.nickname||"";$("#profile-preview").src=myProfile.avatarData||makeLetterSvg((myProfile.nickname||"?").slice(0,1));let newAvatar=myProfile.avatarData||"";$("#profile-file").onchange=async e=>{let file=e.target.files[0];if(!file)return;try{newAvatar=await compressImage(file);$("#profile-preview").src=newAvatar}catch(err){alert("画像を読み込めませんでした")}};$("#profile-cancel").onclick=()=>root.replaceChildren();$("#profile-save").onclick=async()=>{let nickname=$("#profile-nickname").value.trim();if(!nickname){alert("ニックネームを入力してください");return}try{myProfile={nickname,avatarData:newAvatar};await setDoc(doc(db,"profiles",currentUser.uid),{...myProfile,updatedAt:serverTimestamp()});await updateProfile(currentUser,{displayName:nickname});renderMyProfile();root.replaceChildren();subscribeMessages()}catch(e){alert(errText(e))}}}
function compressImage(file){return new Promise((resolve,reject)=>{if(!file.type.startsWith("image/")){reject();return}let reader=new FileReader();reader.onerror=reject;reader.onload=()=>{let img=new Image();img.onerror=reject;img.onload=()=>{let canvas=document.createElement("canvas"),size=160,scale=Math.min(size/img.width,size/img.height,1);canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL("image/jpeg",.78))};img.src=reader.result};reader.readAsDataURL(file)})}
$("#add-channel").onclick=async()=>{let name=prompt("新しいチャンネル名");if(!name?.trim())return;try{let d=await addDoc(collection(db,"channels"),{serverId:activeServerId,name:name.trim().replace(/^#/ ,""),createdAt:serverTimestamp(),archived:false});activeChannelId=d.id}catch(e){alert(errText(e))}};
function manageChannel(c){let choice=prompt(`チャンネル「${c.name}」\n1: 名前を変更\n2: チャンネルを削除`,"1");if(choice==="1"){let name=prompt("新しいチャンネル名",c.name);if(name?.trim())updateDoc(doc(db,"channels",c.id),{name:name.trim()}).catch(e=>alert(errText(e)))}else if(choice==="2"&&confirm("このチャンネルを一覧から削除します。過去のメッセージデータは保持されます。")){updateDoc(doc(db,"channels",c.id),{archived:true}).catch(e=>alert(errText(e)))}}
async function createServer(){let name=prompt("新しいサーバー名");if(!name?.trim())return;try{let d=await addDoc(collection(db,"servers"),{name:name.trim(),ownerUid:currentUser.uid,createdAt:serverTimestamp(),archived:false});activeServerId=d.id;activeChannelId=""}catch(e){alert(errText(e))}}
$("#server-settings").onclick=()=>{if(!isAdmin)return;let s=servers.find(x=>x.id===activeServerId);if(!s)return;let choice=prompt(`サーバー「${s.name}」\n1: 名前を変更\n2: サーバーを削除`,"1");if(choice==="1"){let name=prompt("新しいサーバー名",s.name);if(name?.trim())updateDoc(doc(db,"servers",s.id),{name:name.trim()}).catch(e=>alert(errText(e)))}else if(choice==="2"&&confirm("サーバーを一覧から削除します。配下のチャンネルとメッセージは保持されます。")){updateDoc(doc(db,"servers",s.id),{archived:true}).catch(e=>alert(errText(e)))}};
$("#logout").onclick=async()=>{try{if(currentUser)await set(dbRef(rtdb,"status/"+currentUser.uid),{state:"offline",last_changed:dbTimestamp()})}catch(e){}await signOut(auth)};
function errText(e){const m={"auth/invalid-credential":"メールアドレスまたはパスワードが違います。","auth/email-already-in-use":"このメールアドレスは既に登録されています。","auth/weak-password":"パスワードは6文字以上にしてください。","auth/invalid-email":"メールアドレスの形式を確認してください。","permission-denied":"権限がありません。メンバー登録やFirestoreルールを確認してください。"};return m[e.code]||e.message||"不明なエラー"}
</script></body></html>
